name: Publish WoD Light release

on:
  push:
    branches: [main]
    paths:
      - 'wod-light/**'
      - 'tests/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wod-light-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify manifest, package, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for script in wod-light/scripts/*.js; do node --check "$script"; done
          node --check tests/smoke.mjs
          node tests/smoke.mjs
          test "$(find wod-light/assets/icons -maxdepth 1 -name '*.svg' | wc -l)" -eq 51
          python3 -c "from pathlib import Path; from xml.etree import ElementTree as ET; [ET.parse(str(p)) for p in Path('wod-light/assets/icons').glob('*.svg')]"
          VERSION="$(node -p "require('./wod-light/module.json').version")"
          TAG="v${VERSION}"
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const m = require('./wod-light/module.json');
          assert.equal(m.id, 'wod-light');
          assert.equal(m.compatibility.minimum, '14');
          assert.equal(m.relationships?.systems, undefined);
          assert.equal(m.download, `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${m.version}/wod-light.zip`);
          assert.equal(m.manifest, `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download/module.json`);
          NODE
          (cd wod-light && zip -q -r ../wod-light.zip .)
          unzip -tq wod-light.zip
          test "$(unzip -Z1 wod-light.zip | grep -cx 'module.json')" -eq 1
          test "$(unzip -Z1 wod-light.zip | grep -cx 'scripts/system-adapters.js')" -eq 1
          test "$(unzip -Z1 wod-light.zip | grep -c '^assets/icons/.*\.svg$')" -eq 51
          if unzip -Z1 wod-light.zip | grep -Eiq '(^|/)(private|[0-9]+-.*handoff|.*credentials|.*cookies)'; then
            echo 'Refusing to publish internal files in the ZIP'
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving the published artifacts unchanged."
            exit 0
          fi
          gh release create "$TAG" wod-light.zip wod-light/module.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WoD Light v${VERSION} - Cross-system test release" \
            --notes-file wod-light/RELEASE_NOTES.md
